# ~/.config/hyprdynamicmonitors/config.toml

[general]
destination = "$HOME/.config/hypr/monitors.conf"
debounce_time_ms = 500
post_apply_exec = "until hyprctl monitors >/dev/null 2>&1; do sleep 0.5; done; hyprctl reload"

[scoring]
name_match = 10
description_match = 5
power_state_match = 3
lid_state_match = 2

[power_events]
[power_events.dbus_query_object]
destination = "org.freedesktop.UPower"
path = "/org/freedesktop/UPower/devices/line_power_AC"
method = "org.freedesktop.DBus.Properties.Get"
expected_discharging_value = "false"

[[power_events.dbus_query_object.args]]
arg = "org.freedesktop.UPower.Device"

[[power_events.dbus_query_object.args]]
arg = "Online"

[[power_events.dbus_signal_match_rules]]
interface = "org.freedesktop.DBus.Properties"
object_path = "/org/freedesktop/UPower/devices/line_power_AC"
member = "PropertiesChanged"

[[power_events.dbus_signal_receive_filters]]
name = "org.freedesktop.DBus.Properties.PropertiesChanged"

[lid_events]
[lid_events.dbus_query_object]
destination = "org.freedesktop.UPower"
path = "/org/freedesktop/UPower"
method = "org.freedesktop.DBus.Properties.Get"
expected_lid_closing_value = "true"

[[lid_events.dbus_query_object.args]]
arg = "org.freedesktop.UPower"

[[lid_events.dbus_query_object.args]]
arg = "LidIsClosed"

[[lid_events.dbus_signal_match_rules]]
interface = "org.freedesktop.DBus.Properties"
object_path = "/org/freedesktop/UPower"
member = "PropertiesChanged"

[[lid_events.dbus_signal_receive_filters]]
name = "org.freedesktop.DBus.Properties.PropertiesChanged"
body = "LidIsClosed"

# Monitors are matched by connector *pattern*, not a hard-coded name: the external
# display enumerates as DP-1 or DP-3 depending on which USB-C port the hub is on
# (and as HDMI-A-1 over the laptop's HDMI port), so a profile pinned to "DP-1"
# silently stops matching when the cable moves. Templates then name the actual
# output, so no port-name list has to be maintained.
#
# Ties are broken by definition order (last wins), so the specific profiles are
# declared after the generic laptop-only one.

# --- Profile: Lid Open, No External Monitor ---
[profiles.laptop_only]
config_file = "hyprconfigs/laptop-only.go.tmpl"
config_file_type = "template"

[profiles.laptop_only.conditions]
lid_state = "Opened"

[[profiles.laptop_only.conditions.required_monitors]]
name = "eDP-1"

# --- Profile: Lid Open, External Monitor Attached (any DP/HDMI output) ---
[profiles.external]
config_file = "hyprconfigs/external.go.tmpl"
config_file_type = "template"

[profiles.external.conditions]
lid_state = "Opened"

[[profiles.external.conditions.required_monitors]]
name = "eDP-1"
monitor_tag = "laptop"

[[profiles.external.conditions.required_monitors]]
name = "(DP|HDMI-A)-[0-9]+"
match_name_using_regex = true
monitor_tag = "external"

# --- Profile: Lid Closed, External Monitor Attached (Clamshell) ---
[profiles.clamshell]
config_file = "hyprconfigs/clamshell.go.tmpl"
config_file_type = "template"

[profiles.clamshell.conditions]
lid_state = "Closed"

[[profiles.clamshell.conditions.required_monitors]]
name = "(DP|HDMI-A)-[0-9]+"
match_name_using_regex = true
monitor_tag = "external"

# --- Fallback: states no profile matches (e.g. lid shut with no external display) ---
# Without this hdm logs "No matching profile found" and leaves the monitor config
# from the previous profile in place.
[fallback_profile]
config_file = "hyprconfigs/laptop-only.go.tmpl"
config_file_type = "template"
